<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pink Black Club</title>
    
    <!-- Настройки для Telegram и мобильных систем -->
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#FF00FF', 
                            dark: '#050505',
                            card: '#0F0F0F'
                        }
                    },
                    animation: {
                        'glow': 'glow 4s infinite ease-in-out',
                        'float': 'float 6s infinite ease-in-out',
                    },
                    keyframes: {
                        glow: {
                            '0%, 100%': { opacity: 0.25, transform: 'scale(1)' },
                            '50%': { opacity: 0.5, transform: 'scale(1.1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body { 
            background-color: #050505; 
            color: white; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .logo-glow { 
            filter: drop-shadow(0 0 30px rgba(255, 0, 255, 0.45)); 
        }

        .glass-nav {
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            background: rgba(0, 0, 0, 0.8);
        }

        .tariff-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconCheck = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF00FF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );

        const Logo = ({ size = "h-12", withGlow = false }) => {
            const [error, setError] = useState(false);
            
            if (error) {
                return (
                    <div className={`flex items-center justify-center font-black italic tracking-tighter uppercase ${size} ${withGlow ? 'logo-glow animate-float text-white' : 'text-white'}`}>
                        PINK<span className="text-brand-pink">BLACK</span>CLUB
                    </div>
                );
            }

            return (
                <div className={`flex items-center justify-center ${size} ${withGlow ? 'logo-glow animate-float' : ''}`}>
                    <img 
                        src="photo_2026-01-09_21-49-15.jpg" 
                        alt="Logo" 
                        className="max-h-full w-auto object-contain"
                        onError={() => setError(true)}
                    />
                </div>
            );
        };

        const App = () => {
            const [activeModal, setActiveModal] = useState(null);

            useEffect(() => {
                if (window.Telegram?.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    tg.headerColor = '#000000';
                    tg.backgroundColor = '#050505';
                }
            }, []);

            const tariffs = [
                { id: 1, name: "Стартовый", price: "1 590", period: "30 дней", features: ["Скидка 50% на все товары", "Закрытый чат участников"] },
                { id: 2, name: "VIP Клуб", price: "7 990", period: "180 дней", features: ["Скидка 50% на все товары", "Закрытый чат", "Приоритетный доступ", "Личный менеджер"], best: true },
                { id: 3, name: "Сезонный", price: "4 290", period: "90 дней", features: ["Скидка 50% на все товары", "Закрытый чат участников", "Ранний доступ к новинкам"] }
            ];

            return (
                <div className="min-h-screen flex flex-col bg-brand-dark pb-12">
                    
                    {/* Навигация */}
                    <nav className="fixed top-0 w-full z-50 glass-nav border-b border-white/5 h-16 flex items-center justify-center">
                        <Logo size="h-7" />
                    </nav>

                    {/* Главная часть */}
                    <header className="pt-32 pb-20 px-6 text-center relative overflow-hidden flex flex-col items-center">
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-brand-pink/10 rounded-full blur-[100px] -z-10 animate-glow"></div>
                        
                        <Logo size="h-44 md:h-60" withGlow={true} />
                        
                        <div className="mt-14">
                            <h1 className="text-4xl md:text-6xl font-black italic uppercase tracking-tighter leading-none mb-4 text-white">
                                Вступай <br/> в <span className="text-brand-pink">Клуб</span>
                            </h1>
                            <p className="text-gray-500 text-[10px] uppercase tracking-[0.4em] max-w-[280px] mx-auto opacity-70">
                                Твой стиль — твои привилегии
                            </p>
                        </div>
                        
                        <button 
                            onClick={() => document.getElementById('plans').scrollIntoView({behavior: 'smooth'})}
                            className="mt-12 bg-white text-black text-[11px] font-black uppercase tracking-[0.2em] px-14 py-5 rounded-full shadow-2xl active:scale-95 transition-transform"
                        >
                            Открыть тарифы
                        </button>
                    </header>

                    {/* Тарифы */}
                    <section id="plans" className="py-12 px-5 space-y-6 max-w-lg mx-auto w-full">
                        <div className="flex flex-col items-center mb-8">
                            <div className="h-1 w-12 bg-brand-pink rounded-full mb-3"></div>
                            <h2 className="text-[10px] font-black uppercase tracking-[0.5em] text-gray-600">Варианты участия</h2>
                        </div>
                        
                        {tariffs.map((plan) => (
                            <div 
                                key={plan.id} 
                                className={`tariff-card p-8 rounded-[2.5rem] border relative overflow-hidden ${plan.best ? 'border-brand-pink bg-brand-pink/5' : 'border-white/5 bg-brand-card'}`}
                            >
                                {plan.best && (
                                    <div className="absolute top-0 right-0 bg-brand-pink text-black text-[8px] font-black px-5 py-2 rounded-bl-2xl uppercase tracking-widest shadow-lg">
                                        Выбор резидентов
                                    </div>
                                )}
                                
                                <div className="mb-8 pt-2">
                                    <h3 className="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-2">{plan.name}</h3>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-4xl font-black italic text-white">{plan.price}₽</span>
                                        <span className="text-[10px] text-brand-pink font-black uppercase tracking-tighter">/ {plan.period}</span>
                                    </div>
                                </div>

                                <ul className="space-y-4 mb-10">
                                    {plan.features.map((f, idx) => (
                                        <li key={idx} className="flex items-center gap-3 text-[10px] font-bold uppercase text-gray-400 tracking-wide">
                                            <IconCheck /> {f}
                                        </li>
                                    ))}
                                </ul>

                                <button 
                                    onClick={() => setActiveModal(plan)}
                                    className={`w-full py-5 rounded-2xl font-black uppercase text-[11px] tracking-[0.15em] transition-all ${plan.best ? 'bg-brand-pink text-black shadow-lg shadow-brand-pink/20 active:scale-95' : 'border border-white/10 bg-white/5 active:bg-white active:text-black text-white'}`}
                                >
                                    Оформить карту
                                </button>
                            </div>
                        ))}
                    </section>

                    {/* Подвал */}
                    <footer className="py-24 border-t border-white/5 text-center px-6 mt-10">
                        <Logo size="h-10 opacity-30 mb-10" />
                        
                        <div className="flex justify-center gap-10 text-[9px] font-black uppercase text-gray-600 tracking-widest mb-12">
                            <button className="text-gray-500 hover:text-white transition-colors">Правила</button>
                            <button className="text-gray-500 hover:text-white transition-colors">Помощь</button>
                            <button className="text-gray-500 hover:text-white transition-colors">Чат</button>
                        </div>
                        
                        <div className="space-y-2">
                            <p className="text-[8px] text-zinc-800 uppercase tracking-[0.6em] font-black">
                                PINK BLACK CLUB
                            </p>
                            <p className="text-[7px] text-zinc-900 uppercase tracking-[0.3em] font-bold">
                                Официальная система лояльности © 2026
                            </p>
                        </div>
                    </footer>

                    {/* Модалка */}
                    {activeModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/90 backdrop-blur-md" onClick={() => setActiveModal(null)}>
                            <div className="bg-zinc-950 border border-white/10 w-full max-w-sm p-10 rounded-[3rem] text-center" onClick={e => e.stopPropagation()}>
                                <div className="text-4xl mb-8">💎</div>
                                <h3 className="text-2xl font-black uppercase italic mb-4 text-white">Почти готово</h3>
                                <p className="text-[10px] text-gray-500 uppercase tracking-widest mb-10 leading-relaxed">
                                    Вы выбрали тариф "{activeModal.name}". Сейчас вы перейдете к оплате.
                                </p>
                                <button 
                                    onClick={() => setActiveModal(null)}
                                    className="w-full bg-brand-pink text-black py-5 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95"
                                >
                                    Подтвердить
                                </button>
                                <button 
                                    onClick={() => setActiveModal(null)}
                                    className="mt-6 text-[9px] text-gray-700 uppercase font-black tracking-widest"
                                >
                                    Назад
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
